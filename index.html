<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书单墙 · BOOKSHELF</title>
<style>
  :root{
    --bg:#f7f3ec; --card:#fffdf9; --ink:#2c2620; --sub:#8a7f70;
    --line:#e7dfd2; --accent:#a0522d; --accent-soft:#f3e6dc;
    --shadow:0 1px 3px rgba(60,45,30,.08),0 6px 18px rgba(60,45,30,.06);
    --serif:Georgia,"Songti SC","STSong","SimSun",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  .wrap{max-width:860px;margin:0 auto;padding:0 20px}

  header{padding:36px 0 0}
  .site{font-family:var(--serif);font-size:30px;letter-spacing:.06em}
  .site small{display:block;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;color:var(--sub);letter-spacing:.35em;margin-top:2px}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 8px;position:sticky;top:0;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 14px;z-index:5}

  .years{display:flex;gap:8px}
  .year-tab{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:5px 16px;font-size:14px;cursor:pointer;transition:.2s}
  .year-tab.dim{opacity:.45}
  .year-tab.on{background:var(--ink);color:#fff;border-color:var(--ink);opacity:1}

  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;box-shadow:var(--shadow)}
  .search svg{flex:none;width:16px;height:16px;stroke:var(--sub)}
  .search input{flex:1;border:0;outline:0;background:transparent;font-size:15px;color:var(--ink)}
  .search input::placeholder{color:#b9ad9c}
  .search .clear{display:none;border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  .search.has .clear{display:block}

  .count{font-size:13px;color:var(--sub);padding:6px 2px 10px}

  .list{display:flex;flex-direction:column;gap:20px;padding-bottom:80px}
  .card{display:grid;grid-template-columns:150px 1fr;grid-template-areas:"cover head" "cover intro";column-gap:24px;row-gap:0;align-content:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 24px 20px 20px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;animation:rise .5s both}
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 6px rgba(60,45,30,.1),0 14px 32px rgba(60,45,30,.1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1}}

  .cover{grid-area:cover;width:150px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:4px 6px 14px rgba(50,35,20,.22)}
  .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .cover span{writing-mode:vertical-rl;font-family:var(--serif);color:#fff;font-size:19px;letter-spacing:.25em;text-shadow:0 1px 4px rgba(0,0,0,.3);max-height:88%;overflow:hidden}
  .head{grid-area:head;padding-top:4px}
  .title{font-family:var(--serif);font-size:22px;line-height:1.4;font-weight:600}
  .author{color:var(--sub);font-size:14px;margin-top:6px}
  .author::before{content:"— "}
  .intro{grid-area:intro;color:#57503f;font-size:15px;line-height:1.9;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

  .empty{display:none;text-align:center;padding:70px 0;color:var(--sub)}
  .empty .zh{font-family:var(--serif);font-size:20px;color:var(--ink)}
  .empty button{margin-top:16px;border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 22px;font-size:14px;cursor:pointer}

  @media (max-width:720px){
    .wrap{padding:0 14px}
    .site{font-size:24px}
    .toolbar{flex-direction:column;align-items:stretch}
    .years{overflow-x:auto}
    .search{min-width:0}
    .card{grid-template-columns:72px 1fr;grid-template-areas:"cover head" "intro intro";column-gap:14px;row-gap:4px;padding:16px}
    .cover{width:72px;box-shadow:2px 4px 8px rgba(50,35,20,.25)}
    .cover span{font-size:11px;letter-spacing:.15em}
    .head{padding-top:0;display:flex;flex-direction:column;justify-content:center;min-width:0}
    .intro{-webkit-line-clamp:4;margin-top:6px}
    .title{font-size:18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="site">书单墙<small>BOOKSHELF</small></div>
    <div class="toolbar">
      <nav class="years" id="yearTabs"></nav>
      <label class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索书名或作者…" autocomplete="off">
        <button class="clear" id="clearBtn" title="清除">✕</button>
      </label>
    </div>
    <div class="count" id="count"></div>
  </header>

  <main class="list" id="list"></main>
  <div class="empty" id="empty">
    <div class="zh">加载中…</div>
    <button onclick="resetSearch()">清除搜索</button>
  </div>
</div>

<script>
/* 数据层：并发探测 data/books_<年份>.json（2024 → 当前年+1），成功即入缓存 */
const YEARS=(()=>{const now=new Date().getFullYear();const ys=[];for(let y=2024;y<=now+1;y++)ys.push(y);return ys;})();
const DATA={};
let loaded=false, anyData=false;
const PALETTES=[["#7b5e57","#3e2f2a"],["#5e6e57","#2c3a28"],["#57616e","#232c38"],["#6e576b","#332032"],["#6e5a3f","#3a2c14"],["#4f5e63","#1e2b30"]];
const state={year:new Date().getFullYear(),q:""};

async function loadAll(){
  await Promise.all(YEARS.map(async y=>{
    try{
      const r=await fetch("data/books_"+y+".json?t="+Date.now());
      if(!r.ok)return;
      const j=await r.json();
      if(j&&Array.isArray(j.books)){DATA[y]=j;anyData=true;}
    }catch(e){}
  }));
  loaded=true;
  render();
}

function yearList(){return YEARS;}
function esc(s){return (s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function coverHTML(b,i){
  if(b.cover)return `<img src="${esc(b.cover)}" alt="${esc(b.title)}" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'封面缺失'}))">`;
  const[c1,c2]=PALETTES[i%PALETTES.length];
  return `<span style="background:linear-gradient(160deg,${c1},${c2})">${esc(b.title.slice(0,12))}</span>`;
}

function renderYears(){
  document.getElementById("yearTabs").innerHTML=yearList().map(y=>
    `<button class="year-tab ${y===state.year?"on":""} ${DATA[y]?"":"dim"}" onclick="pickYear(${y})">${y}</button>`).join("");
}
function pickYear(y){state.year=y;state.q="";document.getElementById("q").value="";render();}
function resetSearch(){state.q="";document.getElementById("q").value="";render();}

function match(b,q){
  if(!q)return true;
  const hay=(b.title+" "+(b.author||"")).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
}

function render(){
  renderYears();
  const box=document.getElementById("searchBox");
  box.classList.toggle("has",!!state.q);
  const yd=DATA[state.year];
  const books=yd?yd.books:[];
  const hit=books.filter(b=>match(b,state.q));

  const countEl=document.getElementById("count");
  const listEl=document.getElementById("list");
  const emptyEl=document.getElementById("empty");
  const zh=emptyEl.querySelector(".zh");
  const btn=emptyEl.querySelector("button");

  listEl.style.display=hit.length?"flex":"none";
  emptyEl.style.display="block";
  btn.style.display="none";

  if(!loaded){
    countEl.textContent="加载中…";
    zh.textContent="加载中…";
    return;
  }
  if(!anyData){
    countEl.textContent="";
    zh.textContent="书单数据加载失败：请确认已上传 data/ 目录（需通过服务器访问）";
    listEl.style.display="none";
    return;
  }
  if(!yd){
    countEl.textContent=`${state.year} 年还没有录入书目`;
    zh.textContent=`${state.year} 年的书单还在路上`;
    listEl.style.display="none";
    return;
  }
  countEl.textContent=state.q?`找到 ${hit.length} / ${books.length} 本`:`共 ${books.length} 本 · 更新于 ${yd.updated||""}`;
  if(!hit.length){
    zh.textContent="没有找到相符的书";
    btn.style.display="inline-block";
    return;
  }
  emptyEl.style.display="none";
  listEl.innerHTML=hit.map((b,i)=>`
    <article class="card" style="animation-delay:${Math.min(i,12)*60}ms">
      <div class="cover">${coverHTML(b,i)}</div>
      <div class="head">
        <h2 class="title">${esc(b.title)}</h2>
        <div class="author">${esc(b.author||"—")}</div>
      </div>
      <p class="intro">${esc(b.intro)}</p>
    </article>`).join("");
}

document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;render();});
document.getElementById("clearBtn").addEventListener("click",resetSearch);
loadAll();
</script>
</body>
</html>
